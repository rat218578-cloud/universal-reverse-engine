# Aplicativo Windows (Tauri 2) do Universal Reverse Engine.
# O backend Python continua sendo o motor real: este crate só inicia, monitora e encerra o processo.
[package]
name = "ure-desktop"
version = "0.1.0"
edition = "2021"
description = "Universal Reverse Engine — aplicativo desktop"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
