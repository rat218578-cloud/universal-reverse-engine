name: android-apk

# Compila o aplicativo Android (Tauri 2 + Chaquopy) e gera o APK de depuração como artifact.
# Não publica, não assina para distribuição e não cria release. O APK fica somente no workflow.

on:
  push:
    branches:
      - feature/android-apk
    paths:
      - "apps/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-android-entry:
    name: Testes do backend e do ponto de entrada Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes unitários e de integração (inclui ure_android)
        working-directory: apps/backend
        run: python -m unittest discover -s tests -t . -v

  build-apk:
    name: Build do APK de depuração (arm64 + x86_64)
    needs: backend-android-entry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      TAURI_CLI_VERSION: "2.12.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SDK e NDK Android (sdkmanager)
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platform-tools"
          echo "NDK_HOME=$SDK/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cache do tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-ubuntu-24.04-v1

      - name: Instalar tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Gerar projeto Android e aplicar o overlay
        run: bash apps/desktop/android/scripts/prepare-android.sh

      - name: Compilar APK de depuração
        working-directory: apps/desktop/src-tauri
        run: cargo tauri android build --debug --apk --target aarch64 --target x86_64

      - name: Verificar APK (ABIs, interface e Python embutido)
        run: |
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*debug*" | head -1)
          if [ -z "$APK" ]; then echo "::error::APK de depuração não foi gerado"; exit 1; fi
          LIST=$(unzip -l "$APK")
          echo "$LIST" | grep -q "assets/ure-web/index.html" || { echo "::error::interface ausente no APK"; exit 1; }
          echo "$LIST" | grep -q "lib/arm64-v8a/" || { echo "::error::biblioteca arm64-v8a ausente"; exit 1; }
          echo "$LIST" | grep -q "lib/x86_64/" || { echo "::error::biblioteca x86_64 ausente"; exit 1; }
          echo "$LIST" | grep -q "chaquopy" || { echo "::error::runtime Chaquopy ausente"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/universal-reverse-engine-debug.apk"
          sha256sum "$RUNNER_TEMP/out/universal-reverse-engine-debug.apk" | tee "$RUNNER_TEMP/out/SHA256SUMS.txt"
          ls -l "$RUNNER_TEMP/out"

      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Teste de instalação no emulador x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash apps/desktop/android/scripts/emulator-smoke.sh "${{ runner.temp }}/out/universal-reverse-engine-debug.apk" "${{ runner.temp }}/emulator"

      - name: Artifact — evidências do teste no emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-reverse-engine-emulator-smoke
          path: ${{ runner.temp }}/emulator/*
          if-no-files-found: warn
          retention-days: 14

      - name: Artifact — APK de depuração
        uses: actions/upload-artifact@v4
        with:
          name: universal-reverse-engine-android-debug
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 14
